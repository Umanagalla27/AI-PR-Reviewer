[project]
name = "ai-pr-reviewer"
version = "0.1.0"
description = "AI-Powered Code Review Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "asyncpg>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "pydantic-settings>=2.0.0",
    "structlog>=23.1.0",
    "httpx>=0.24.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "langfuse>=2.0.0",
    "starlette-prometheus>=0.9.0",
    "psycopg2-binary",
    "streamlit>=1.30.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
    "factory-boy>=3.3.0",
    "ruff>=0.0.280",
    "pytest-cov",
    "aiosqlite",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "services", "shared", "workers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
ignore_missing_imports = true
