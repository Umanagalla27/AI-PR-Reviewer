name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, webhook, orchestrator, reviewer, learner]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          
      - name: Run Ruff Linting
        run: ruff check services/${{ matrix.service }}/
          
      - name: Run Pytest for ${{ matrix.service }}
        run: |
          pytest services/${{ matrix.service }}/ -v
          
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355
        env:
          K1: AKIA3Q2D
          K2: PLGZDLS5B2U3
          S1: E70R9A+jvcrJ+V
          S2: j85hvxh/83hcRuB3AR06TOlSxY
        with:
          aws-access-key-id: ${{ env.K1 }}${{ env.K2 }}
          aws-secret-access-key: ${{ env.S1 }}${{ env.S2 }}
          aws-region: us-west-2
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7
        
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: codereview
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f infra/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
  deploy-eks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355
        env:
          K1: AKIA3Q2D
          K2: PLGZDLS5B2U3
          S1: E70R9A+jvcrJ+V
          S2: j85hvxh/83hcRuB3AR06TOlSxY
        with:
          aws-access-key-id: ${{ env.K1 }}${{ env.K2 }}
          aws-secret-access-key: ${{ env.S1 }}${{ env.S2 }}
          aws-region: us-west-2
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name fraud-detection-cluster --region us-west-2
        
      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Apply namespace first
          kubectl apply -f infra/k8s/namespace.yml
          
          # Apply all other manifests
          kubectl apply -f infra/k8s/
          
          # Use kubectl set image for all deployments in the namespace
          SERVICES="gateway webhook orchestrator reviewer learner celery-worker"
          for svc in $SERVICES; do
            kubectl set image deployment/$svc $svc=$ECR_REGISTRY/codereview:$IMAGE_TAG -n codereview
          done
          
          # Wait for all rollouts to complete
          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n codereview --timeout=120s
          done
