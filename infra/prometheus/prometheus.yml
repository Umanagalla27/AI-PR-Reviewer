global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']
  - job_name: 'webhook'
    static_configs:
      - targets: ['webhook:8001']
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8002']
  - job_name: 'reviewer'
    static_configs:
      - targets: ['reviewer:8003']
  - job_name: 'learner'
    static_configs:
      - targets: ['learner:8004']
