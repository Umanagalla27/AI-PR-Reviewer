apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: codereview
data:
  DATABASE_URL: "postgresql+asyncpg://codereview:codereview@postgres:5432/codereview"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  OPENAI_MODEL: "gpt-4o-mini"
  WEBHOOK_SERVICE_URL: "http://webhook:8001"
  ORCHESTRATOR_URL: "http://orchestrator:8002"
  REVIEWER_URL: "http://reviewer:8003"
  LEARNER_URL: "http://learner:8004"
  LANGFUSE_HOST: "https://cloud.langfuse.com"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
