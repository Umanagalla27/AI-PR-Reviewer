---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learner
  namespace: codereview
  labels:
    app: learner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learner
  template:
    metadata:
      labels:
        app: learner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
    spec:
      containers:
        - name: learner
          image: ${ECR_REGISTRY}/ai-pr-reviewer/learner:latest
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learner
  namespace: codereview
spec:
  selector:
    app: learner
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
