---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: codereview
  labels:
    app: celery-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ${ECR_REGISTRY}/ai-pr-reviewer/celery-worker:latest
          command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
