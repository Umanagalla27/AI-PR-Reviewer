---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: codereview
  labels:
    app: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: orchestrator
          image: ${ECR_REGISTRY}/ai-pr-reviewer/orchestrator:latest
          command: ["uvicorn", "services.orchestrator.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: codereview
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
