---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewer
  namespace: codereview
  labels:
    app: reviewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reviewer
  template:
    metadata:
      labels:
        app: reviewer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
    spec:
      containers:
        - name: reviewer
          image: ${ECR_REGISTRY}/ai-pr-reviewer/reviewer:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reviewer
  namespace: codereview
spec:
  selector:
    app: reviewer
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
