apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: codereview
  labels:
    app: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: ghcr.io/umanagalla27/ai-pr-reviewer:main
          imagePullPolicy: Always
          command: ["python", "-m", "streamlit", "run", "services/chatbot/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-svc
  namespace: codereview
spec:
  selector:
    app: chatbot
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
  type: LoadBalancer
